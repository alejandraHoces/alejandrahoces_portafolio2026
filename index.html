<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="__SITE_DESCRIPTION__" />
    <meta name="theme-color" content="#123f45" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Preload de los .woff2 reales (subset latin) para no esperar la cadena HTML → CSS de Google → woff2.
      Plus Jakarta Sans es variable: un solo archivo cubre 400/500/600.
      Si se cambia el query de fuentes de abajo, hay que volver a sacar estas URLs de la respuesta de fonts.googleapis.com.
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/plusjakartasans/v12/LDIoaomQNQcsA88c7O9yZ4KMCoOg4Ko20yw.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/newsreader/v26/cY9VfjOCX1hbuyalUrK49dLafXjalZCsZBsgBgbNJYQ.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/newsreader/v26/cY9XfjOCX1hbuyalUrK439vogqCz_goCYw7oRd6JFYYzbA.woff2" />
    <!-- Solo los pesos/estilos que usa el CSS: Newsreader 400 (+ itálica 400 del logo "ah"), Plus Jakarta Sans 400–600 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" />
    <script>
      /* Sin soporte para animaciones ligadas al scroll: activa el fallback antes del primer pintado */
      if (!(window.CSS && CSS.supports && CSS.supports('animation-timeline: view()'))) document.documentElement.classList.add('no-sda')
    </script>
    <style>
      /* Loader inicial: tapa la página hasta que las fuentes están listas (ver main.jsx) */
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #123f45;
        transition: opacity 0.45s cubic-bezier(0.2, 0.7, 0.2, 1), visibility 0s linear 0.45s;
      }
      #preloader.is-done {
        opacity: 0;
        visibility: hidden;
      }
      #preloader span {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #fff;
        color: #134a49;
        display: flex;
        align-items: center;
        justify-content: center;
        font: italic 24px/1 Georgia, serif;
        letter-spacing: -0.06em;
        animation: preloaderPulse 1.1s ease-in-out infinite alternate;
      }
      @keyframes preloaderPulse {
        from { opacity: 0.55; transform: scale(0.94); }
        to { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader, #preloader span { transition: none; animation: none; }
      }
    </style>
    <title>__SITE_TITLE__</title>
  </head>
  <body>
    <div id="preloader" aria-hidden="true"><span>__SITE_INITIALS__</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
